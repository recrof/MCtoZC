# MeshCore -> ZephCore repeater migrator: no BLE, no radio, just flash + filesystem.

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_BUILD_OUTPUT_UF2=y

# ZephCore's own littlefs v2 volume (/lfs). Mounted by hand, never automounted:
# an automount would format 0xD4000-0xF4000 before main() could read MeshCore's
# volume, which lives at 0xED000, inside that range.
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS_FSTAB_AUTOMOUNT=n
CONFIG_FS_LITTLEFS_NUM_FILES=4
CONFIG_FS_LITTLEFS_NUM_DIRS=2
CONFIG_FS_LITTLEFS_CACHE_SIZE=64

# littlefs v1 (vendored, read-only) uses malloc for its file buffer.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=2048
CONFIG_MAIN_STACK_SIZE=4096

# Console on USB CDC (same stack as ZephCore's formatter)
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_ENABLE_AT_BOOT=y

CONFIG_LOG=n
CONFIG_ASSERT=n
CONFIG_REBOOT=y
CONFIG_GPIO=y

# Peripherals a board's DTS enables that would hang without their hardware.
CONFIG_GNSS=n
CONFIG_I2C=n
CONFIG_SENSOR=n
CONFIG_SPI=n

# Base-board (nrf52840dk) buttons, LEDs and ADC: nothing to drive or read.
CONFIG_INPUT=n
CONFIG_PWM=n
CONFIG_ADC=n
